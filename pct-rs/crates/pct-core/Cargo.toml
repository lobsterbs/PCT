[package]
name = "pct-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "PCT core in Rust: scoring, canonical manifests, run sessions, deterministic payloads, redaction. Parity-tested against the TypeScript reference."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
fancy-regex = "0.13"
