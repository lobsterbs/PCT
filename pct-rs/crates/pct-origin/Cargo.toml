[package]
name = "pct-origin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "PCT test origin in Rust. Byte-compatible with packages/server (TypeScript); verified by running the TypeScript runner against it."

[dependencies]
pct-core = { path = "../pct-core" }
tiny_http = "0.12"
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
